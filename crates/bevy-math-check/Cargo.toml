[package]
name = "bevy-math-check"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone probe: does `bevy_math` (and its `glam` 0.32) actually *compute
# correctly* on `armv6k-nintendo-3ds`, not just compile? The 3DS pulls trig /
# sqrt from devkitPro newlib, so vector/quat/matrix math needs on-device checks.
#
#   cargo 3ds build -p bevy-math-check
#   ./scripts/test-emulator.sh -p bevy-math-check
[dependencies]
# `std` (as dove uses) + `curve` + `rand`. `rand` (with default-features off, as
# bevy_math itself pins it) does NOT pull `getrandom` — it builds fine for the
# 3DS target; the `sampling` module just needs an explicit `RngCore`.
bevy_math = { version = "0.19", default-features = false, features = ["std", "curve", "rand"] }

[dev-dependencies]
rand = { version = "0.10", default-features = false }
test-runner = { git = "https://github.com/rust3ds/ctru-rs" }
