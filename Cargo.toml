[workspace]
members = ["crates/bevy-ecs-check", "crates/bevy-math-check"]
resolver = "3"

[package]
name = "dove"
version = "0.1.0"
edition = "2024"

[dependencies]
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
ctru-sys = { git = "https://github.com/rust3ds/ctru-rs" }
citro3d = { git = "https://github.com/rust3ds/citro3d-rs" }
# Core ECS only — see crates/bevy-ecs-check for why this works on the 3DS.
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
# glam-based vector/matrix math (Vec2/Vec3/…). No `rand`/`curve`/`bevy_reflect`.
bevy_math = { version = "0.19", default-features = false, features = ["std"] }

# Optimise even the debug `.3dsx` a bit — an unoptimised bevy_ecs + f32 render
# loop is painfully slow on ARM11.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
# Custom test harness that reports results over GDB's File-I/O channel so
# `cargo 3ds test` works on hardware and in emulators. See scripts/test-emulator.sh.
test-runner = { git = "https://github.com/rust3ds/ctru-rs" }

[package.metadata.cargo-3ds]
romfs_dir = "romfs"
